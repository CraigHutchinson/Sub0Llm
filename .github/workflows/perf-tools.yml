name: Performance workflow
on:
  push:
    branches: [main]
    paths: ['tools/perf/**', 'scripts/qwen_chat_poc.py', 'scripts/compare_qwen_speed.py', 'scripts/compare_qwen_concurrency.py', 'tools/qwen_phase_metrics.hpp', 'tools/qwen_projection_profile.hpp', 'tools/qwen_quality_metrics.hpp', 'tools/tokenize_quality_native.cpp', 'scripts/tests/**', 'scripts/optimization/**', 'perf/optimization/**', 'tools/sub0llm-dense-token.cpp', 'tools/sub0llm-export-tokenizer.cpp', 'tools/dense_qwen_support.hpp', 'tools/reference/**', 'tools/perf_extensions/**', 'perf/workloads/**', 'cmake/Sub0*Perf*', 'cmake/Sub0MathTooling.cmake', 'benchmarks/dense_quant_perf.cpp', 'benchmarks/iq1s_perf.hpp', 'benchmarks/float_reduce_perf.hpp', 'include/sub0/**', 'tests/vendor/nanobench.h', 'scripts/check_sub0perf_vendor.py', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/perf-tools.yml', 'benchmarks/iq2xxs_perf.hpp', 'benchmarks/iq2xxs_fixture.hpp', 'benchmarks/q8k_fixture.hpp', 'benchmarks/q8k_perf.hpp', 'benchmarks/q16_fixture.hpp']
  pull_request:
    paths: ['tools/perf/**', 'scripts/qwen_chat_poc.py', 'scripts/compare_qwen_speed.py', 'scripts/compare_qwen_concurrency.py', 'tools/qwen_phase_metrics.hpp', 'tools/qwen_projection_profile.hpp', 'tools/qwen_quality_metrics.hpp', 'tools/tokenize_quality_native.cpp', 'scripts/tests/**', 'scripts/optimization/**', 'perf/optimization/**', 'tools/sub0llm-dense-token.cpp', 'tools/sub0llm-export-tokenizer.cpp', 'tools/dense_qwen_support.hpp', 'tools/reference/**', 'tools/perf_extensions/**', 'perf/workloads/**', 'cmake/Sub0*Perf*', 'cmake/Sub0MathTooling.cmake', 'benchmarks/dense_quant_perf.cpp', 'benchmarks/iq1s_perf.hpp', 'benchmarks/float_reduce_perf.hpp', 'include/sub0/**', 'tests/vendor/nanobench.h', 'scripts/check_sub0perf_vendor.py', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/perf-tools.yml', 'benchmarks/iq2xxs_perf.hpp', 'benchmarks/iq2xxs_fixture.hpp', 'benchmarks/q8k_fixture.hpp', 'benchmarks/q8k_perf.hpp', 'benchmarks/q16_fixture.hpp']
permissions:
  contents: read
jobs:
  tooling:
    name: tooling (${{ matrix.isa }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: generic
            cxx_flags: ''
          - isa: avx2
            cxx_flags: '-mavx2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify tooling, provenance and benchmark protocol
        run: |
          cmake -S . -B out/perf-ci -DSUB0_PERF_ONLY=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_STANDARD=26 -DSUB0MATH_PERF_ON_BUILD=OFF -DSUB0MATH_PERF_GIT_HOOKS=OFF -DSUB0MATH_NATIVE_ARCH=OFF -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          cmake --build out/perf-ci -j2
          ctest --test-dir out/perf-ci --output-on-failure
      - name: Machine utility build and CLI contracts
        run: |
          clang++ -std=c++2c -O2 -Wall -Wextra -Werror ${{ matrix.cxx_flags }} -Iinclude -pthread tools/sub0llm-machine.cpp -o out/perf-ci/sub0llm-machine
          out/perf-ci/sub0llm-machine --facts --out out/perf-ci/machine.json
          python -c 'import json; json.load(open("out/perf-ci/machine.json"))'
          for budget in inf nan 1e999 86401; do
            if out/perf-ci/sub0llm-machine --roofs all --budget "$budget"; then exit 1; else test "$?" -eq 2; fi
          done
      - name: Full calibrated sampling (diagnostic on shared hosted hardware)
        run: python tools/perf/bench_check.py run --exe out/perf-ci/sub0llm-bench-denseq --out out/perf-ci/perf/samples.json --rounds 3 --settle 0
      - uses: actions/upload-artifact@v4
        with:
          name: sub0perf-samples-${{ matrix.isa }}
          path: out/perf-ci/perf/samples.json
